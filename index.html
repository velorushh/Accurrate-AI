<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACCURRATE AI | Collaborative AI Brand Compliance & Governance</title>
    <link rel="icon" type="image/png" href="/accurrate-icon-v2.png" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('accurrate_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- ABC Diatype is self-hosted. Place font files in public/fonts/ -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
